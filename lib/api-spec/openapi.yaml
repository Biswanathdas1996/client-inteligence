openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: research
    description: Client intelligence research
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /research:
    post:
      operationId: generateResearch
      tags: [research]
      summary: Generate company intelligence and pitch report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRequest"
      responses:
        "200":
          description: Research report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchReport"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ResearchRequest:
      type: object
      required: [companyName, country, topics]
      properties:
        companyName:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        persona:
          type: string
          description: Buyer persona (e.g. CFO, COO, CIO, CRO)
        productLine:
          type: string
          description: >
            Optional product or business line to scope the entire report against
            (live web research, peers, financials, topics, and AI solution mapping).
        topics:
          type: array
          items: { type: string }
          minItems: 1
        knowledgeBase:
          type: array
          description: Optional rows from the AI Solutions Knowledge Base (Excel)
          items:
            $ref: "#/components/schemas/KbSolution"
    KbSolution:
      type: object
      properties:
        name: { type: string }
        capability: { type: string }
        industry: { type: string }
        useCase: { type: string }
        valueProposition: { type: string }
    PeerCompany:
      type: object
      required: [name, rationale]
      properties:
        name: { type: string }
        rationale: { type: string }
        revenueGrowth: { type: string }
        margin: { type: string }
        strength: { type: string }
        weakness: { type: string }
        sourceUrl: { type: string, description: Source URL for peer data }
    PeerComparisonMetric:
      type: object
      description: |
        One row in the company-vs-peer-average matrix. For insurers the
        canonical metrics are: Combined ratio, Loss ratio, NWP growth,
        Book size, Net profit. Every numeric value MUST be sourced inline.
      required: [label, companyValue, peerAverage]
      properties:
        label: { type: string, description: "Metric name, e.g. 'Combined ratio', 'NWP growth'." }
        unit: { type: string, description: "Unit hint for display, e.g. '%', '₹ Cr', '$M', 'pp'." }
        companyValue:
          type: string
          description: |
            The selected company's latest reported value for this metric, with
            an inline Markdown link to the primary source (filing, IR page,
            regulator return). Example: "[96.4%](https://...)".
        peerAverage:
          type: string
          description: |
            Average of the peer set listed under "peers", as a single value
            with an inline Markdown link to the source / methodology page.
            Example: "[101.2% (n=4 peers, FY25)](https://...)".
        delta:
          type: string
          description: |
            Optional one-line delta with direction (e.g. "-4.8 pp better"
            or "+220 bps worse"). Sign convention should reflect whether
            the company is above/below average.
        interpretation:
          type: string
          description: One-line plain-English read of the gap (optional).
    PeerComparison:
      type: object
      description: |
        Side-by-side benchmarking of the selected company vs the average of
        the peers listed in "peers[]" across the core industry KPIs. The
        peer set MUST be the same companies named in "peers[]".
      required: [metrics]
      properties:
        peerSetSummary:
          type: string
          description: |
            One sentence naming the peer set used for the average and the
            reporting period it spans. Inline source link required.
            Example: "Peer set: [HDFC Life](https://...), [SBI Life](https://...),
            [ICICI Pru Life](https://...), [Max Life](https://...) — FY25 disclosures."
        metrics:
          type: array
          items: { $ref: "#/components/schemas/PeerComparisonMetric" }
    TopicFinding:
      type: object
      required: [topic, summary, signals]
      properties:
        topic: { type: string }
        summary: { type: string }
        sourceUrl: { type: string, description: Source URL for the topic finding summary }
        signals:
          type: array
          items: { type: string }
        signalSources:
          type: array
          description: Source URLs parallel to each signal entry
          items: { type: string }
    PainPoint:
      type: object
      required: [title, description, evidence, persona, businessFunction]
      properties:
        title: { type: string }
        description: { type: string }
        evidence: { type: string }
        sourceUrl: { type: string, description: Source URL backing the evidence }
        persona: { type: string }
        businessFunction: { type: string }
    AiSolution:
      type: object
      required: [name, source, problem, howAiHelps, businessImpact, persona, painPointTitle]
      properties:
        name: { type: string }
        source:
          type: string
          enum: [knowledge_base, external]
        problem: { type: string }
        howAiHelps: { type: string }
        businessImpact: { type: string }
        persona: { type: string }
        painPointTitle: { type: string }
        sourceUrl: { type: string, description: Source URL for external solution reference }
        roiCalculation:
          $ref: "#/components/schemas/RoiCalculation"
    RoiCalculation:
      type: object
      description: Worked ROI math for an AI solution — every input must be sourced.
      required: [baseline, uplift, formula, annualValue]
      properties:
        baseline:
          type: string
          description: |
            Current-state cost or volume the solution acts on, with the inline
            Markdown link to the source. Example: "Acme processes ~[12M invoices/year](https://...) at a manual cost of [~$8.40 per invoice](https://...)."
        uplift:
          type: string
          description: |
            Quantitative improvement assumption (% time saved, % defect reduction,
            % capacity unlocked, etc.) — must cite an industry benchmark source
            inline. Example: "Generative-AI invoice automation typically delivers
            [55-70% straight-through processing](https://...) per Gartner."
        formula:
          type: string
          description: |
            The actual arithmetic, written so a reader can audit it. Use plain
            math notation. Example: "12,000,000 × $8.40 × 60% = $60.5M annual savings."
        annualValue:
          type: string
          description: |
            Headline annualised value (savings, revenue uplift, or risk reduction
            in $/€/₹), with currency and period clearly stated. Example:
            "≈ $60.5M / year in OpEx savings."
        paybackPeriod:
          type: string
          description: |
            Estimated payback window vs. implementation cost, with the cost
            assumption sourced. Example: "Implementation ~[$5-7M](https://...)
            → payback in 1-2 months."
        assumptions:
          type: array
          description: Each assumption MUST contain an inline Markdown link to its source.
          items: { type: string }
    FinancialMetric:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        trend: { type: string }
        sourceUrl: { type: string, description: Source URL for this financial metric }
    CompanySnapshot:
      type: object
      required: [description, revenueStreams, financialMetrics, strategicInitiatives]
      properties:
        description: { type: string }
        revenueStreams:
          type: array
          items: { type: string }
        financialMetrics:
          type: array
          items: { $ref: "#/components/schemas/FinancialMetric" }
        strategicInitiatives:
          type: array
          items: { type: string }
    Mapping:
      type: object
      required: [painPoint, solution, businessValue]
      properties:
        painPoint: { type: string }
        solution: { type: string }
        businessValue: { type: string }
    ResearchReport:
      type: object
      required:
        - companyName
        - country
        - generatedAt
        - executiveSummary
        - companySnapshot
        - peers
        - topicFindings
        - painPoints
        - solutions
        - mapping
      properties:
        companyName: { type: string }
        country: { type: string }
        persona: { type: string }
        productLine:
          type: string
          description: When provided at generation time, the report is scoped to this product or business line only.
        generatedAt: { type: string, format: date-time }
        executiveSummary: { type: string }
        companySnapshot:
          $ref: "#/components/schemas/CompanySnapshot"
        peers:
          type: array
          items: { $ref: "#/components/schemas/PeerCompany" }
        peerComparison:
          $ref: "#/components/schemas/PeerComparison"
        topicFindings:
          type: array
          items: { $ref: "#/components/schemas/TopicFinding" }
        painPoints:
          type: array
          items: { $ref: "#/components/schemas/PainPoint" }
        solutions:
          type: array
          items: { $ref: "#/components/schemas/AiSolution" }
        mapping:
          type: array
          items: { $ref: "#/components/schemas/Mapping" }
        assumptions:
          type: array
          items: { type: string }
