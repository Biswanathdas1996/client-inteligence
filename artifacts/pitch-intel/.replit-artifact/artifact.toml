kind = "web"
previewPath = "/"
title = "PwC Client Intelligence"
version = "1.0.0"
id = "artifacts/pitch-intel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18303

[services.development]
run = "pnpm --filter @workspace/pitch-intel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pitch-intel", "run", "build" ]
publicDir = "artifacts/pitch-intel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18303"
BASE_PATH = "/"
